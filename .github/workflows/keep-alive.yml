name: Keep database awake

# Supabase's free plan pauses a project after about a week without activity.
# This calls the CRM's health endpoint (which runs a trivial query) a few times a week.
on:
  schedule:
    - cron: "17 6 * * 1,3,5" # Monday, Wednesday, Friday 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call health endpoint
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 60 https://uniqcrm.netlify.app/api/health
